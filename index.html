<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pidenow - Maqueta Funcional</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #f8f9fa; color: #212529; padding: 16px; display: flex; flex-direction: column; align-items: center; }
        .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }
        
        /* 1. HERO HEADER */
        .header { text-align: center; padding: 20px 0; background: white; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .header h1 { font-size: 1.6rem; font-weight: 800; color: #1a1a1a; }
        .status-badge { display: inline-block; background-color: #e6f4ea; color: #137333; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; margin-top: 8px; }

        /* 2. MÓDULO DE ANUNCIOS */
        .announcement-banner { background-color: #fff3cd; border-left: 5px solid #ffc107; color: #856404; padding: 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; font-weight: 500; }

        /* 3. ACORDEONES VERTICALES (Estilo Pulcinella) */
        .accordion-item { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .accordion-header { background: white; padding: 18px; font-size: 1.1rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid #f1f3f5; }
        .accordion-icon { transition: transform 0.2s; font-size: 0.9rem; color: #6c757d; }
        .accordion-content { display: none; padding: 12px; flex-direction: column; gap: 12px; background: #fafafa; }
        
        /* Estado abierto del acordeón */
        .accordion-item.active .accordion-content { display: flex; }
        .accordion-item.active .accordion-icon { transform: rotate(180deg); }

        /* 4. TARJETAS DE PRODUCTO */
        .product-card { display: flex; background: white; padding: 12px; border-radius: 12px; border: 1px solid #e9ecef; gap: 12px; align-items: center; }
        .product-info { flex: 1; }
        .product-name { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
        .product-desc { font-size: 0.85rem; color: #6c757d; line-height: 1.3; margin-bottom: 8px; }
        .product-price { font-size: 1.05rem; font-weight: 800; color: #1a1a1a; }
        
        /* Controles de cantidad */
        .product-controls { display: flex; align-items: center; gap: 12px; background: #f1f3f5; padding: 6px 12px; border-radius: 20px; }
        .control-btn { border: none; background: transparent; font-size: 1.2rem; font-weight: 700; color: #495057; cursor: pointer; width: 24px; height: 24px; }
        .qty-num { font-weight: 700; font-size: 1rem; min-width: 16px; text-align: center; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="header">
            <h1 id="restaurante-nombre">Pizzería Pulcinella</h1>
            <div class="status-badge">● Abierto ahora</div>
        </header>

        <div class="announcement-banner">
            ⚠️ <strong>Aviso importante:</strong> Queridos clientes, este sábado 24 de junio no atenderemos por modificaciones en el local. Agradecemos su comprensión y los esperamos como siempre desde el 25 de junio.
        </div>

        <div id="menu-container" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </div>

    <script>
        // Datos de prueba para ver el comportamiento
        const PRODUCTOS = [
            { id: 1, categoria: "Pizzas 🍕", nombre: "Pizza Americana", desc: "Salsa de tomate, muzzarella y jamón inglés.", precio: "35.00" },
            { id: 2, categoria: "Pizzas 🍕", nombre: "Pizza Pepperoni", desc: "Salsa de tomate, muzzarella y harto pepperoni americano.", precio: "38.00" },
            { id: 3, categoria: "Combos 🎁", nombre: "Combo Maradoniano", desc: "1 Pizza Grande + 2 Calzones + 1 Gaseosa 1L.", precio: "50.00" },
            { id: 4, categoria: "Bebidas 🥤", nombre: "Inca Kola 1 Litro", desc: "Heladita, como debe ser.", precio: "8.00" }
        ];

        function renderizarMenu() {
            const container = document.getElementById('menu-container');
            // Agrupar productos por categoría
            const categorias = [...new Set(PRODUCTOS.map(p => p.categoria))];
            
            categorias.forEach(cat => {
                const item = document.createElement('div');
                item.className = 'accordion-item';
                
                // HTML del Acordeón
                let htmlProductos = '';
                PRODUCTOS.filter(p => p.categoria === cat).forEach(p => {
                    htmlProductos += `
                        <div class="product-card">
                            <div class="product-info">
                                <div class="product-name">${p.nombre}</div>
                                <div class="product-desc">${p.desc}</div>
                                <div class="product-price">S/ ${p.precio}</div>
                            </div>
                            <div class="product-controls">
                                <button class="control-btn">−</button>
                                <span class="qty-num">0</span>
                                <button class="control-btn">+</button>
                            </div>
                        </div>
                    `;
                });

                item.innerHTML = `
                    <div class="accordion-header" onclick="toggleAccordion(this)">
                        <span>${cat}</span>
                        <span class="accordion-icon">▼</span>
                    </div>
                    <div class="accordion-content">
                        ${htmlProductos}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function toggleAccordion(header) {
            const item = header.parentElement;
            item.classList.toggle('active');
        }

        // Arrancar el motor al cargar
        renderizarMenu();
    </script>
</body>
</html>
